services:
  postgres-db:
    image: postgres:16-alpine
    container_name: salux_db_container
    restart: always
    environment:
      # Superusuario: solo para administrar el servidor (la app NO lo usa).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: salux_db
      # Los lee el script docker/postgres-init/01-crear-rol-app.sh, que en una
      # instalación nueva crea el rol de la app (dueño de salux_db y nada más).
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      # Solo accesible desde esta máquina (Prisma Studio, un cliente SQL):
      # publicar 5432 en 0.0.0.0 deja la base abierta a toda la red.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    # Healthcheck para que el backend no arranque antes de que la base esté lista
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salux_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Contadores de los límites de intentos (login, registro, etc.): compartidos
  # entre instancias y que sobreviven a un reinicio. Solo accesible dentro de
  # la red de docker-compose (no se publica ningún puerto).
  redis:
    image: redis:7-alpine
    container_name: salux_redis_container
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build: .
    container_name: salux_backend_container
    restart: always
    env_file:
      - .env
    environment:
      # Dentro de la red de docker-compose, la DB se resuelve por el nombre del servicio, no "localhost".
      DATABASE_URL: postgresql://${DB_APP_USER}:${DB_APP_PASSWORD}@postgres-db:5432/salux_db
      DIRECT_URL: postgresql://${DB_APP_USER}:${DB_APP_PASSWORD}@postgres-db:5432/salux_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Aplica migraciones pendientes antes de levantar el servidor.
    # Se invoca el archivo real del paquete con node en vez de depender de
    # node_modules/.bin (algunos entornos Docker/Windows no generan esos
    # symlinks) ni de npx (puede intentar resolver el paquete por red).
    command: sh -c "node node_modules/prisma/build/index.js migrate deploy && node src/app.js"

volumes:
  postgres_data:
